<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olivia's World</title>
  <meta name="theme-color" content="#ffd64d" />
  <style>
    :root {
      --bg: #fffaf0;
      --card: #ffffff;
      --accent: #ffb800;
      --accent-dark: #d99200;
      --text: #2d2d2d;
      --muted: #666666;
      --shadow: rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fffaf0 0%, #ffeec0 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      width: min(92vw, 560px);
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 18px 48px var(--shadow);
      padding: 32px 24px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fff2b5;
      color: #7a5700;
      font-weight: 700;
      border-radius: 999px;
      padding: 8px 14px;
      margin-bottom: 18px;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 auto 24px;
      max-width: 420px;
      font-size: 1.06rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #1f1f1f;
      font-weight: 700;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 1.1rem;
      box-shadow: 0 10px 24px rgba(255, 184, 0, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(255, 184, 0, 0.4);
    }

    .small {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .small strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Olivia's World</div>
    <h1>Download the App</h1>
    <p>
      Tap below to download the Android tablet version of Olivia's World.
      If your browser asks for permission, allow the install and continue.
    </p>

    <a class="download-btn" href="/cuppylandapp/app-release.apk" download>
      Download APK
    </a>

    <div class="small">
      <strong>Note:</strong> On Android, you may need to allow installs from your browser or file manager.
    </div>
  </main>
</body>
</html>
