<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Olivia's World</title>
    <link rel="icon" href="./assets/cuppyland-icon192.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="gameShell" class="game-shell">
      <div id="gameViewport" class="game-viewport">
        <div id="app" class="app">
          <section id="splashScreen" class="screen active">
            <div class="splash-bg"></div>
            <button id="playBtn" class="play-btn" type="button">Play Game</button>
            <span class="splash-version" aria-label="Game version">V1.0</span>
          </section>

          <section id="worldSelectScreen" class="screen">
            <div class="panel">
              <div class="world-select-header">
                <h1>Choose a World</h1>
                <details class="inventory-settings world-select-settings" id="inventorySettings">
                  <summary class="inventory-settings-trigger" aria-label="Open settings" title="Settings">
                    ⚙
                  </summary>
                  <div class="inventory-settings-menu">
                    <h3>Audio</h3>
                    <div class="slider-row">
                      <label class="slider-field" for="musicVolumeInput">
                        <span>Music Volume</span>
                        <span id="musicVolumeValue">70%</span>
                      </label>
                      <button id="musicMuteBtn" class="audio-mute-btn" type="button" aria-pressed="false">Mute Music</button>
                    </div>
                    <input id="musicVolumeInput" type="range" min="0" max="100" step="1" value="70" />

                    <div class="slider-row">
                      <label class="slider-field" for="sfxVolumeInput">
                        <span>SFX Volume</span>
                        <span id="sfxVolumeValue">75%</span>
                      </label>
                      <button id="sfxMuteBtn" class="audio-mute-btn" type="button" aria-pressed="false">Mute SFX</button>
                    </div>
                    <input id="sfxVolumeInput" type="range" min="0" max="100" step="1" value="75" />
                  </div>
                </details>
              </div>
              <div class="world-grid">
                <button class="world-card" type="button" data-world="playground">
                  <span class="world-card-headline" aria-hidden="true"></span>
                  <span class="world-name">Playground</span>
                </button>
                <button class="world-card" type="button" data-world="olivia-room">
                  <span class="world-card-headline" aria-hidden="true"></span>
                  <span class="world-name">Olivia's Room</span>
                </button>
              </div>
              <button id="backToSplashBtn" class="secondary-btn" type="button">Back</button>
            </div>
          </section>

          <section id="worldScreen" class="screen">
            <div class="world-topbar">
              <button id="closeWorldBtn" class="icon-btn danger" type="button" aria-label="Close world">
                ✕
              </button>
              <button
                id="inventoryToggleBtn"
                class="icon-btn"
                type="button"
                aria-label="Toggle inventory"
                title="Inventory"
              >
                <span class="backpack-icon" aria-hidden="true">
                  <span class="backpack-icon-body"></span>
                  <span class="backpack-icon-flap"></span>
                  <span class="backpack-icon-pocket"></span>
                </span>
              </button>
            </div>

            <div id="worldViewport" class="world-viewport">
              <div id="worldCanvas" class="world-canvas">
                <div id="worldBackground" class="world-bg">
                  <div class="world-bg-panel world-bg-panel-1" aria-hidden="true"></div>
                  <div class="world-bg-panel world-bg-panel-2" aria-hidden="true"></div>
                  <div class="world-bg-panel world-bg-panel-3" aria-hidden="true"></div>
                </div>
                <div id="worldBackgroundObjects" class="world-background-objects" aria-hidden="true"></div>
                <div id="worldHeadlineOverlay" class="world-headline-overlay" aria-hidden="true"></div>
                <div id="cupCharacter" class="cup-character">
                  <div id="dropZoneLid" class="drop-zone drop-lid" data-target="lid" aria-label="Lid drop zone"></div>
                  <canvas id="lidLayer" class="cup-lid" width="232" height="149"></canvas>
                  <div id="dropZoneCup" class="drop-zone drop-cup" data-target="cup" aria-label="Cup drop zone"></div>
                  <canvas id="cupLayer" class="cup-base" width="220" height="230"></canvas>
                  <div id="hairstyleLayer" class="cup-hairstyle" aria-label="Hairstyle layer"></div>
                  <div
                    id="dropZoneSleeve"
                    class="drop-zone drop-sleeve"
                    data-target="sleeve"
                    aria-label="Sleeve drop zone"
                  ></div>
                  <canvas id="sleeveLayer" class="cup-sleeve" width="200" height="110" aria-label="Sleeve layer"></canvas>
                  <div id="faceLayer" class="cup-face" aria-label="Face expression layer"></div>
                </div>
              </div>
            </div>

            <aside id="inventoryPanel" class="inventory-panel" aria-label="Inventory panel">
              <div class="inventory-header-row">
                <h2>Inventory</h2>
              </div>
              <p class="hint">Drag an item onto the matching cup area.</p>

              <div class="inventory-group">
                <h3>Colors</h3>
                <div id="colorTargetToggle" class="color-target-toggle" role="group" aria-label="Color target">
                  <button type="button" class="color-target-btn is-active" data-target="lid">Lid</button>
                  <button type="button" class="color-target-btn" data-target="cup">Cup</button>
                </div>
                <div id="colorItems" class="items-row"></div>
              </div>

              <div class="inventory-group">
                <h3>Expressions</h3>
                <div id="expressionItems" class="items-row"></div>
              </div>

              <div class="inventory-group">
                <h3>Hairstyles</h3>
                <div id="hairstyleItems" class="items-row"></div>
              </div>

              <div class="inventory-group">
                <h3>Accessories</h3>
                <div id="accessoriesItems" class="items-row"></div>
              </div>

              <div class="inventory-group">
                <h3>Pets</h3>
                <div id="petsItems" class="items-row pets-inventory-grid"></div>
              </div>

              <div class="inventory-group">
                <h3>Friends</h3>
                <div id="friendsItems" class="items-row"></div>
              </div>
            </aside>
          </section>
        </div>

        <div id="closeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="closeModalTitle">
          <div class="modal-card">
            <h2 id="closeModalTitle">Close world?</h2>
            <p>Are you sure you want to leave this world?</p>
            <div class="modal-actions">
              <button id="confirmCloseBtn" class="danger-btn" type="button">Yes</button>
              <button id="cancelCloseBtn" class="secondary-btn" type="button">No</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="rotatePrompt" class="rotate-prompt hidden">
      <div class="rotate-card">
        <h2>Please rotate your tablet</h2>
        <p>This game is designed for landscape mode.</p>
      </div>
    </div>

    <div id="dragGhost" class="drag-ghost hidden"></div>
    <script src="./src/core/world-anchor-registry.js"></script>
    <script src="./src/core/object-overlay-registry.js"></script>
    <script src="./src/core/game-config.js"></script>
    <script src="./src/core/interaction-rule-registry.js"></script>
    <script src="./src/core/trigger-manifest.js"></script>
    <script src="./src/state/drag-state-store.js"></script>
    <script src="./src/core/dom-elements.js"></script>
    <script src="./src/state/cup-state-store.js"></script>
    <script src="./src/interaction/interaction-helpers.js"></script>
    <script src="./src/interaction/cup-drag-helpers.js"></script>
    <script src="./src/controllers/cup-pointer-controller.js"></script>
    <script src="./src/controllers/inventory-interaction-controller.js"></script>
    <script src="./src/controllers/screen-world-controller.js"></script>
    <script src="./src/controllers/render-controller.js"></script>
    <script src="./src/controllers/bootstrap-controller.js"></script>
    <script src="./src/controllers/game-rules-controller.js"></script>
    <script src="./src/controllers/sparkle-effect-controller.js"></script>
    <script src="./src/controllers/chocolate-milk-fill-controller.js"></script>
    <script src="./src/controllers/chocolate-milk-spill-helper.js"></script>
    <script src="./src/controllers/chocolate-milk-sequence-controller.js"></script>
    <script src="./src/controllers/world-headline-controller.js"></script>
    <script src="./src/controllers/background-object-controller.js"></script>
    <script src="./src/controllers/tube-slide-controller.js"></script>
    <script src="./src/controllers/timer-lifecycle-controller.js"></script>
    <script src="./src/controllers/friend-release-controller.js"></script>
    <script src="./src/controllers/friend-render-controller.js"></script>
    <script src="./src/controllers/friend-removal-controller.js"></script>
    <script src="./src/controllers/cup-part-drag-controller.js"></script>
    <script src="./src/controllers/motion-sequence-helper.js"></script>
    <script src="./src/controllers/app-action-controller.js"></script>
    <script src="./src/interaction/friend-overlap-helper.js"></script>
    <script src="./src/controllers/pet-asset-controller.js"></script>
    <script src="./src/controllers/doghouse-controller.js"></script>
    <script src="./src/controllers/puppy-sequence-asset-helper.js"></script>
    <script src="./src/controllers/puppy-sequence-guard-helper.js"></script>
    <script src="./src/controllers/puppy-ball-claim-helper.js"></script>
    <script src="./src/controllers/friend-animation-helper.js"></script>
    <script src="./src/controllers/puppy-sequence-controller.js"></script>
    <script src="./src/controllers/friend-proximity-controller.js"></script>
    <script src="./src/controllers/puppy-request-controller.js"></script>
    <script src="./src/controllers/puppy-facing-helper.js"></script>
    <script src="./src/controllers/friend-double-tap-controller.js"></script>
    <script src="./src/controllers/friend-pointer-controller.js"></script>
    <script src="./src/controllers/friend-motion-controller.js"></script>
    <script src="./src/controllers/world-friend-controller.js"></script>
    <script src="./src/controllers/world-coordinate-controller.js"></script>
    <script src="./src/controllers/world-layer-controller.js"></script>
    <script src="./src/controllers/cup-position-controller.js"></script>
    <script src="./src/controllers/world-cup-controller.js"></script>
    <script src="./src/ui/inventory.js"></script>
    <script src="./src/audio/audio-engine.js"></script>
    <script src="./src/audio/audio.js"></script>
    <script src="./src/core/app.js"></script>
  </body>
</html>
